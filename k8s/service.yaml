apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: pod1-gateway-registration
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: update-service
spec:
  type: ClusterIP
  selector:
    app: pod2-update-service
  ports:
    - port: 3002
      targetPort: 3002