apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod1-gateway-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod1-gateway-registration
  template:
    metadata:
      labels:
        app: pod1-gateway-registration
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: REGISTRATION_URL
              value: "http://localhost:3001"
            - name: UPDATE_URL
              value: "http://update-service:3002"
        - name: registration
          image: registration:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod2-update-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod2-update-service
  template:
    metadata:
      labels:
        app: pod2-update-service
    spec:
      containers:
        - name: update-service
          image: update-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI